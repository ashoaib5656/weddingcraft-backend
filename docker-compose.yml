services:
  db:
    image: postgres:16-alpine
    container_name: weddingcraft_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: weddingcraft_redis
    ports:
      - "${REDIS_PORT}:6379"

  api:
    build:
      context: .
      dockerfile: weddingcraft_be/Dockerfile
    container_name: weddingcraft_api
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__Host=redis
      - Redis__Port=6379
      - JwtSettings__Secret=${JWT_SECRET}
      - Smtp__User=${SMTP_USER}
      - Smtp__Pass=${SMTP_PASS}
      - Seed__AdminPassword=${ADMIN_PASSWORD}

volumes:
  postgres_data:
